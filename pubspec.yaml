name: aura_workspace
description: Aura — a weather app for iOS and Android.
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

workspace:
  - apps/aura
  - packages/aura_core
  - packages/aura_design
  - packages/aura_l10n
  - packages/aura_providers
  - packages/aura_test_kit
  - packages/aura_ui
  - packages/aura_network
  - packages/aura_weather_api
  - packages/aura_storage
  - packages/aura_domain
  - packages/aura_data
  - packages/features/aura_feature_home
  - packages/features/aura_feature_search
  - packages/features/aura_feature_saved_cities
  - packages/features/aura_feature_settings
  - packages/features/aura_feature_details
  - packages/features/aura_feature_onboarding

dev_dependencies:
  # Held at 7.8.x: 7.8.2+ needs cli_util ^0.5.0, but drift_dev (capped at 2.34.0
  # by the SDK analyzer ceiling) needs ^0.4.0. One shared resolution, one answer.
  melos: ">=7.8.0 <7.8.2"
  very_good_analysis: ^10.3.0

melos:
  name: aura

  command:
    bootstrap:
      environment:
        sdk: ^3.12.0
        flutter: ">=3.44.0"

  scripts:
    gen:
      description: Run build_runner across every package that needs codegen.
      run: dart run build_runner build --delete-conflicting-outputs
      exec:
        concurrency: 1
      packageFilters:
        dependsOn: build_runner

    gen:l10n:
      description: Generate the localization delegate from the ARB files.
      run: flutter gen-l10n
      exec:
        concurrency: 1
      packageFilters:
        fileExists: l10n.yaml

    gen:watch:
      description: Watch and regenerate codegen output.
      run: dart run build_runner watch --delete-conflicting-outputs
      exec:
        concurrency: 1
      packageFilters:
        dependsOn: build_runner

    analyze:
      description: Static analysis across the workspace. Infos are fatal.
      run: dart analyze --fatal-infos --fatal-warnings .

    format:
      description: Format every Dart file.
      run: dart format --set-exit-if-changed .

    test:
      description: Unit and widget tests for every package that has them.
      run: flutter test
      exec:
        concurrency: 4
      packageFilters:
        dirExists: test

    coverage:
      description: |
        Tests with coverage. Named `coverage` rather than `test:coverage`
        because melos matches a script name by prefix, and `melos run test`
        would otherwise stop to ask which of the two was meant.

        Goldens are excluded: this is the script CI's Linux job runs, and a
        Linux renderer antialiases differently enough to fail every file.
        They run in their own job, on the platform that generated them.
      run: flutter test --coverage --exclude-tags golden
      exec:
        concurrency: 4
      packageFilters:
        dirExists: test

    gold:
      description: Golden tests only.
      run: flutter test --tags golden
      exec:
        concurrency: 4
      packageFilters:
        dirExists: test/goldens

    gold:update:
      description: Regenerate goldens. Review the diff by eye before committing.
      run: flutter test --tags golden --update-goldens
      exec:
        concurrency: 1
      packageFilters:
        dirExists: test/goldens

    ci:
      description: Everything CI runs. Must pass before any commit.
      # gen runs first: generated sources are gitignored, so a fresh clone has
      # no *.g.dart and analysis would fail on the missing part files.
      #
      # --no-select throughout: a script with packageFilters stops to offer a
      # single package to run in, and a chained script must not stop to ask.
      run: |
        melos run --no-select gen && \
        melos run --no-select gen:l10n && \
        melos run --no-select format && \
        melos run --no-select analyze && \
        melos run --no-select test
