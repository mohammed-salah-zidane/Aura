name: aura
description: Weather in a new light.
version: 1.0.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  aura_core:
    path: ../../packages/aura_core
  aura_data:
    path: ../../packages/aura_data
  aura_design:
    path: ../../packages/aura_design
  aura_domain:
    path: ../../packages/aura_domain
  aura_feature_details:
    path: ../../packages/features/aura_feature_details
  aura_feature_home:
    path: ../../packages/features/aura_feature_home
  aura_feature_onboarding:
    path: ../../packages/features/aura_feature_onboarding
  aura_feature_saved_cities:
    path: ../../packages/features/aura_feature_saved_cities
  aura_feature_search:
    path: ../../packages/features/aura_feature_search
  aura_feature_settings:
    path: ../../packages/features/aura_feature_settings
  aura_network:
    path: ../../packages/aura_network
  aura_storage:
    path: ../../packages/aura_storage
  aura_weather_api:
    path: ../../packages/aura_weather_api
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.2.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  geolocator: ^14.0.3
  go_router: ^17.3.0
  intl: ^0.20.2
  permission_handler: ^12.0.3

dev_dependencies:
  build_runner: ^2.4.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true
