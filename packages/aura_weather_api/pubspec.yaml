name: aura_weather_api
description: "WeatherAPI.com endpoints and DTOs."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  aura_core:
    path: ../aura_core
  aura_network:
    path: ../aura_network
  json_annotation: ^4.12.0
  meta: ^1.18.0

dev_dependencies:
  build_runner: ^2.4.0
  # Dev only, and deliberately not a dependency. The tests stub the transport
  # by swapping Dio's adapter, which needs the type; production code here
  # never touches Dio and reaches the network only through aura_network.
  dio: ^5.11.0
  json_serializable: ^6.14.0
  mocktail: ^1.0.5
  test: ^1.25.0
  very_good_analysis: ^10.3.0
