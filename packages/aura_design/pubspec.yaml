name: aura_design
description: "Aura design system. Tokens read from aura.pen."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  lucide_icons_flutter: ^3.1.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

flutter:
  # Variable fonts, declared once per family. Weight is driven through
  # fontVariations in AuraText, so no per-weight assets are needed.
  #
  # The three Latin families carry no Arabic glyphs at all, so the two Noto
  # Arabic families back them as fontFamilyFallback. Both are variable on wght
  # over 100-900, which covers every weight the type scale asks for.
  fonts:
    - family: Fraunces
      fonts:
        - asset: fonts/Fraunces.ttf
    - family: Outfit
      fonts:
        - asset: fonts/Outfit.ttf
    - family: Inter
      fonts:
        - asset: fonts/Inter.ttf
    - family: NotoKufiArabic
      fonts:
        - asset: fonts/NotoKufiArabic.ttf
    - family: NotoSansArabic
      fonts:
        - asset: fonts/NotoSansArabic.ttf

  # The Open Font License requires the licence to travel with the fonts, so the
  # texts ship as assets and are added to the LicenseRegistry at startup.
  assets:
    - fonts/OFL-Fraunces.txt
    - fonts/OFL-Inter.txt
    - fonts/OFL-NotoKufiArabic.txt
    - fonts/OFL-NotoSansArabic.txt
    - fonts/OFL-Outfit.txt
