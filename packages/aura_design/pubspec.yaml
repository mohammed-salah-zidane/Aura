name: aura_design
description: "Aura design system. Tokens read from aura.pen."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  lucide_icons_flutter: ^3.1.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

flutter:
  # Variable fonts, declared once per family. Weight is driven through
  # fontVariations in AuraText, so no per-weight assets are needed.
  fonts:
    - family: Fraunces
      fonts:
        - asset: fonts/Fraunces.ttf
    - family: Outfit
      fonts:
        - asset: fonts/Outfit.ttf
    - family: Inter
      fonts:
        - asset: fonts/Inter.ttf
