name: aura_storage
description: "Drift-backed cache and preferences. Implements domain storage ports."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  aura_core:
    path: ../aura_core
  aura_domain:
    path: ../aura_domain
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5

dev_dependencies:
  build_runner: ^2.4.0
  # Held at 2.34.0: 2.34.1+ needs analyzer ^13, but flutter_test + test cap
  # the workspace at analyzer <13.0.0 on Flutter 3.44.8.
  drift_dev: ">=2.34.0 <2.34.1"
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  test: ^1.25.0
  very_good_analysis: ^10.3.0
