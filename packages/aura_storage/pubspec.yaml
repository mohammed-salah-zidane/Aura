name: aura_storage
description: "Drift-backed cache and preferences. Implements domain storage ports."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  aura_core:
    path: ../aura_core
  aura_domain:
    path: ../aura_domain
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5

dev_dependencies:
  # Dev only, and deliberately not dependencies. The cache round trip is tested
  # against the entity the mapper really produces from a captured response, so
  # a shape this package cannot store fails here rather than on a device. No
  # production edge exists, and the layering holds.
  aura_data:
    path: ../aura_data
  aura_weather_api:
    path: ../aura_weather_api
  build_runner: ^2.4.0
  # Held at 2.34.0: 2.34.1+ needs analyzer ^13, but flutter_test + test cap
  # the workspace at analyzer <13.0.0 on Flutter 3.44.8.
  drift_dev: ">=2.34.0 <2.34.1"
  flutter_test:
    sdk: flutter
  # The in-memory SharedPreferencesAsync double lives in the platform interface.
  shared_preferences_platform_interface: ^2.4.1
  very_good_analysis: ^10.3.0
