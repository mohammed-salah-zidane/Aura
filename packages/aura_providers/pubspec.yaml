name: aura_providers
description: "Injection seams and the app-wide state every Aura feature shares."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

# Pure Dart. `riverpod` rather than `flutter_riverpod`, because nothing here
# touches a widget, and the two packages share the same Provider types.
dependencies:
  aura_core:
    path: ../aura_core
  aura_domain:
    path: ../aura_domain
  # Matches the SDK's own pin exactly; see docs/ARCHITECTURE.md section 10.
  meta: ^1.18.0
  riverpod: ^3.4.1

dev_dependencies:
  test: ^1.25.0
  very_good_analysis: ^10.3.0
